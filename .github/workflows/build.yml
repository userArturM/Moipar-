name: Windows build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install cryptography pyinstaller pystray pillow openpyxl winrt-Windows.Security.Credentials.UI
      - name: Regression tests
        run: python -m unittest discover -s tests -v
      - name: Portable EXE
        run: pyinstaller --onefile --noconsole --name MoiParoli --icon icon.ico --collect-submodules pystray --hidden-import pystray._win32 --collect-submodules winrt moi_paroli.py
      - name: Browser host
        run: pyinstaller --onefile --noconsole --name browser_host browser_host.py
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Installer EXE
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'
      - name: Verify built executables
        run: python tools/verify_windows_build.py
      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: MoiParoli-checksums
          path: dist/BUILD_MANIFEST.json
          if-no-files-found: error
      - name: Upload portable
        uses: actions/upload-artifact@v4
        with:
          name: MoiParoli-portable
          path: dist/MoiParoli.exe
          if-no-files-found: error
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: MoiParoli-Setup
          path: installer_out/MoiParoli-Setup.exe
          if-no-files-found: error
