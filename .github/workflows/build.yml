name: Windows build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: moiparoli-windows-main
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install cryptography pyinstaller pystray pillow openpyxl
      - name: Regression tests
        run: python -m unittest discover -s tests -v
      - name: Validate browser extension
        run: node tools/test_extension.mjs
      - name: Validate browser saving
        run: node tools/test_browser_save.mjs
      - name: Validate persistent browser requests
        run: node tools/test_browser_worker.cjs
      - name: Real Chromium form tests
        shell: pwsh
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install chromium
          node tools/test_browser_forms.cjs
          node tools/test_browser_advanced.cjs
          node tools/test_browser_status.cjs
      - name: Build desktop Windows Hello helper
        shell: pwsh
        run: ./tools/build_hello.ps1
      - name: Validate native Hello helper
        run: python tools/test_hello_helper.py
      - name: Portable EXE
        run: pyinstaller --onefile --noconsole --name MoiParoli --icon icon.ico --add-data "icon.ico;." --add-data "translations.json;." --collect-submodules pystray --hidden-import pystray._win32 --add-binary "dist/hello_verify.exe;." moi_paroli.py
      - name: Browser host
        run: pyinstaller --onefile --console --name browser_host --add-data "translations.json;." --add-binary "dist/hello_verify.exe;." browser_host.py
      - name: Sign application binaries when a publisher certificate is configured
        shell: pwsh
        env:
          MOIPAROLI_SIGNING_PFX_BASE64: ${{ secrets.MOIPAROLI_SIGNING_PFX_BASE64 }}
          MOIPAROLI_SIGNING_PASSWORD: ${{ secrets.MOIPAROLI_SIGNING_PASSWORD }}
        run: ./tools/sign_windows.ps1 -Phase app
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Installer EXE
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'
      - name: Sign installer when a publisher certificate is configured
        shell: pwsh
        env:
          MOIPAROLI_SIGNING_PFX_BASE64: ${{ secrets.MOIPAROLI_SIGNING_PFX_BASE64 }}
          MOIPAROLI_SIGNING_PASSWORD: ${{ secrets.MOIPAROLI_SIGNING_PASSWORD }}
        run: ./tools/sign_windows.ps1 -Phase installer
      - name: Verify built executables
        run: python tools/verify_windows_build.py
      - name: Test packaged Native Messaging host
        run: python tools/test_packaged_host.py
      - name: Download previous 4.1 installer for upgrade test
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: MoiParoli-Setup
          run-id: 38591978269
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: previous_release
      - name: Test installer lifecycle
        run: python tools/test_installer.py
      - name: Package complete portable application
        run: python tools/package_portable.py
      - name: Prepare store submission package
        shell: pwsh
        run: |
          python tools/package_store.py store_package
          node tools/store_artwork.cjs store_package
          Compress-Archive -Path store_package/* -DestinationPath MoiParoli-store-kit.zip
      - name: Upload store submission package
        uses: actions/upload-artifact@v4
        with:
          name: MoiParoli-store-kit
          path: store_package/**
          if-no-files-found: error
      - name: Upload browser integration
        uses: actions/upload-artifact@v4
        with:
          name: MoiParoli-BrowserHost
          path: |
            dist/browser_host.exe
            browser_extension/**
            register_browser_host.ps1
            register_browser_host.py
            browser_registration.py
            browser_identity.py
          if-no-files-found: error
      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: MoiParoli-checksums
          path: dist/BUILD_MANIFEST.json
          if-no-files-found: error
      - name: Upload portable
        uses: actions/upload-artifact@v4
        with:
          name: MoiParoli-portable
          path: portable/**
          if-no-files-found: error
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: MoiParoli-Setup
          path: installer_out/MoiParoli-Setup.exe
          if-no-files-found: error


      - name: Publish tested release
        id: publish_release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $head = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha
          if ($LASTEXITCODE -ne 0) { throw "Cannot check repository head" }
          if ($head -ne $env:GITHUB_SHA) { Write-Output "A newer commit exists; release publication skipped"; exit 0 }
          Compress-Archive -Path portable/* -DestinationPath MoiParoli-portable.zip
          $version = python -c "import moi_paroli; print(moi_paroli.APP_VERSION)"
          $tag = "v$version"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag installer_out/MoiParoli-Setup.exe MoiParoli-portable.zip MoiParoli-store-kit.zip dist/BUILD_MANIFEST.json --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed' }
          } else {
            gh release create $tag installer_out/MoiParoli-Setup.exe MoiParoli-portable.zip MoiParoli-store-kit.zip dist/BUILD_MANIFEST.json --target $env:GITHUB_SHA --title "Мои пароли $version" --notes-file RELEASE_NOTES.md
            if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
          }

          "published=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Verify public update and installer download
        if: steps.publish_release.outputs.published == 'true'
        run: python tools/test_public_update.py
