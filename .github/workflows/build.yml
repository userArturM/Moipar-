name: Windows build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install cryptography pyinstaller pystray pillow openpyxl
      - name: Regression tests
        run: python -m unittest discover -s tests -v
      - name: Validate browser extension
        run: node tools/test_extension.mjs
      - name: Real Chromium form tests
        shell: pwsh
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install chromium
          node tools/test_browser_forms.cjs
      - name: Build desktop Windows Hello helper
        shell: pwsh
        run: ./tools/build_hello.ps1
      - name: Portable EXE
        run: pyinstaller --onefile --noconsole --name MoiParoli --icon icon.ico --collect-submodules pystray --hidden-import pystray._win32 --add-binary "dist/hello_verify.exe;." moi_paroli.py
      - name: Browser host
        run: pyinstaller --onefile --console --name browser_host browser_host.py
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Installer EXE
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'
      - name: Verify built executables
        run: python tools/verify_windows_build.py
      - name: Test packaged Native Messaging host
        run: python tools/test_packaged_host.py
      - name: Download previous 4.1 installer for upgrade test
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: MoiParoli-Setup
          run-id: 38591978269
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: previous_release
      - name: Test installer lifecycle
        run: python tools/test_installer.py
      - name: Upload browser integration
        uses: actions/upload-artifact@v4
        with:
          name: MoiParoli-BrowserHost
          path: |
            dist/browser_host.exe
            browser_extension/**
            register_browser_host.ps1
            register_browser_host.py
          if-no-files-found: error
      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: MoiParoli-checksums
          path: dist/BUILD_MANIFEST.json
          if-no-files-found: error
      - name: Upload portable
        uses: actions/upload-artifact@v4
        with:
          name: MoiParoli-portable
          path: dist/MoiParoli.exe
          if-no-files-found: error
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: MoiParoli-Setup
          path: installer_out/MoiParoli-Setup.exe
          if-no-files-found: error

