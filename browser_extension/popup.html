<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{color-scheme:dark;--bg:#202023;--text:#f5f5f7;--muted:#a9a9b0;--accent:#409cff;--ink:#10172b}
@media(prefers-color-scheme:light){:root{color-scheme:light;--bg:#f5f5f7;--text:#1d1d1f;--muted:#67676f;--accent:#0067d9;--ink:#fff}}
*{box-sizing:border-box}body{font:14px "Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text);width:340px;padding:24px;margin:0}
.brand{font-size:12px;font-weight:600;color:var(--accent);letter-spacing:1px}
h1{font-size:23px;letter-spacing:-.5px;margin:16px 0 10px}p{color:var(--muted);line-height:1.6;margin:0 0 20px}
button{border:0;background:var(--accent);color:var(--ink);padding:13px;width:100%;font:600 14px "Segoe UI",sans-serif;border-radius:9px;cursor:pointer}
button:focus-visible{outline:2px solid var(--text);outline-offset:3px}button:disabled{opacity:.6;cursor:wait}
#status{min-height:40px;font-size:12px;margin:16px 0 0}
.secondary{margin-top:10px;background:transparent;color:var(--text);border:1px solid var(--muted)}.option{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);margin-top:18px;line-height:1.5}.link{background:transparent;color:var(--accent);font-size:12px;margin-top:8px} </style></head><body>
<div class="brand">◈ МОИ ПАРОЛИ</div><h1>Ваши пароли</h1>
<p>Подтвердите сайт в окне приложения через Windows Hello или мастер-пароль. Заполняйте данные или сохраняйте новый пароль с сайта.</p>
<button id="fill">Заполнить данные</button><button id="save" class="secondary">Сохранить с сайта</button><label class="option"><input type="checkbox" id="autosave"> Предлагать сохранение на этом сайте</label><button id="connect" class="link">Проверить подключение</button><p id="status" role="status" aria-live="polite"></p>
<script src="popup.js"></script><script src="save.js"></script></body></html>
